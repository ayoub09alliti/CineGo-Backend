<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Formulaire Media - CineGo Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div layout:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800" th:text="${media.id != null} ? 'Modifier le Media' : 'Nouveau Media'">Media</h1>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form th:action="@{/admin/medias/save}" th:object="${media}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Chemin / URL</label>
                        <input type="text" th:field="*{media}" class="form-control" required="required"/>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Type</label>
                        <select th:field="*{typeMedia}" class="form-select">
                            <option value="">-- Choisir --</option>
                            <option th:each="t : ${T(com.cinego.cingobackend.model.Media.TypeMedia).values()}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Film</label>
                        <select th:field="*{film}" class="form-select">
                            <option value="">-- Choisir un film --</option>
                            <option th:each="f : ${films}" th:value="${f.id}" th:text="${f.titre}"></option>
                        </select>
                    </div>
                </div>
                <hr/>
                <a th:href="@{/admin/medias}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Annuler</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
