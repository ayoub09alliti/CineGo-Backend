<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Medias - CineGo Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div layout:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Medias</h1>
        <a th:href="@{/admin/medias/new}" class="btn btn-sm btn-primary shadow-sm">
            <i class="fas fa-plus fa-sm text-white-50"></i> Nouveau Media
        </a>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead class="bg-gray-100">
                        <tr><th>ID</th><th>Media</th><th>Type</th><th>Film</th><th style="width:180px">Actions</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="media : ${medias}">
                            <td th:text="${media.id}"></td>
                            <td th:text="${media.media}"></td>
                            <td th:text="${media.typeMedia}"></td>
                            <td th:text="${media.film?.titre}"></td>
                            <td>
                                <a th:href="@{/admin/medias/{id}/edit(id=${media.id})}" class="btn btn-warning btn-sm"><i class="fas fa-edit"></i></a>
                                <form th:action="@{/admin/medias/{id}/delete(id=${media.id})}" method="post" style="display:inline" onsubmit="return confirm('Supprimer ce media ?')">
                                    <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(medias)}"><td colspan="5" class="text-center text-gray-500 py-4">Aucun media trouve.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
