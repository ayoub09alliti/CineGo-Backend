<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Dashboard - CineGo Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div layout:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Dashboard</h1>
    </div>
    <div class="row">
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-primary text-uppercase mb-1">Films</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" th:text="${filmCount}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-film fa-2x text-gray-300"></i></div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/admin/films}" class="small text-primary stretched-link">Gerer les films &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-success text-uppercase mb-1">Genres</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" th:text="${genreCount}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-tags fa-2x text-gray-300"></i></div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/admin/genres}" class="small text-success stretched-link">Gerer les genres &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-info shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-info text-uppercase mb-1">Salles</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" th:text="${salleCount}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-building fa-2x text-gray-300"></i></div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/admin/salles}" class="small text-info stretched-link">Gerer les salles &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-warning shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-warning text-uppercase mb-1">Seances</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" th:text="${seanceCount}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-clock fa-2x text-gray-300"></i></div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/admin/seances}" class="small text-warning stretched-link">Gerer les seances &rarr;</a>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-danger shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-danger text-uppercase mb-1">Nationalites</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" th:text="${nationaliteCount}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-flag fa-2x text-gray-300"></i></div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/admin/nationalites}" class="small text-danger stretched-link">Gerer les nationalites &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-secondary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-secondary text-uppercase mb-1">Personnes</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" th:text="${personneCount}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-user fa-2x text-gray-300"></i></div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/admin/personnes}" class="small text-secondary stretched-link">Gerer les personnes &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-dark shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-dark text-uppercase mb-1">Medias</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" th:text="${mediaCount}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-images fa-2x text-gray-300"></i></div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/admin/medias}" class="small text-dark stretched-link">Gerer les medias &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-primary text-uppercase mb-1">Customers</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" th:text="${customerCount}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-user-group fa-2x text-gray-300"></i></div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/admin/customers}" class="small text-primary stretched-link">Gerer les customers &rarr;</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
