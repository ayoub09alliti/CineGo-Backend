<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Formulaire Client - CineGo Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div layout:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800" th:text="${customer.id != null} ? 'Modifier le Client' : 'Nouveau Client'">Client</h1>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form th:action="@{/admin/customers/save}" th:object="${customer}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Prenom</label>
                        <input type="text" th:field="*{firstname}" class="form-control" required="required"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nom</label>
                        <input type="text" th:field="*{lastname}" class="form-control" required="required"/>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required="required"/>
                    </div>
                </div>
                <div class="row mb-3" th:if="${customer.id == null}">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Mot de passe initial</label>
                        <input type="password" th:field="*{password}" class="form-control" required="required"/>
                    </div>
                </div>
                <div class="alert alert-info" th:unless="${customer.id == null}">
                    <i class="fas fa-lock"></i> Le mot de passe d'un client ne peut pas etre modifie par un admin .
                </div>
                <hr/>
                <a th:href="@{/admin/customers}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Annuler</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
