<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Films - CineGo Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div layout:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Films</h1>
        <a th:href="@{/admin/films/new}" class="btn btn-sm btn-primary shadow-sm">
            <i class="fas fa-plus fa-sm text-white-50"></i> Nouveau Film
        </a>
    </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead class="bg-gray-100">
                        <tr>
                            <th>ID</th>
                            <th>Titre</th>
                            <th>Duree</th>
                            <th>Annee</th>
                            <th>Genre</th>
                            <th>Nationalite</th>
                            <th style="width:180px">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="film : ${films}">
                            <td th:text="${film.id}"></td>
                            <td th:text="${film.titre}"></td>
                            <td th:text="${film.duree} + ' min'"></td>
                            <td th:text="${film.annee}"></td>
                            <td th:text="${film.genre?.libelle}"></td>
                            <td th:text="${film.nationalite?.libelle}"></td>
                            <td>
                                <a th:href="@{/admin/films/{id}/edit(id=${film.id})}" class="btn btn-warning btn-sm">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{/admin/films/{id}/delete(id=${film.id})}" method="post" style="display:inline" onsubmit="return confirm('Supprimer ce film ?')">
                                    <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(films)}">
                            <td colspan="7" class="text-center text-gray-500 py-4">Aucun film trouve.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
