<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title layout:title-pattern="$CONTENT_TITLE - CineGo Admin">CineGo Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body id="page-top">

<div id="wrapper">

    <!-- Sidebar -->
    <ul class="navbar-nav sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/admin}">
            <div class="sidebar-brand-icon">
                <i class="fas fa-film"></i>
            </div>
            <div class="sidebar-brand-text mx-3">CineGo</div>
        </a>

        <hr class="sidebar-divider my-0"/>

        <li class="nav-item" th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin}">
                <i class="fas fa-fw fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <hr class="sidebar-divider"/>
        <div class="sidebar-heading">Gestion</div>

        <li class="nav-item" th:classappend="${currentPage == 'films'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin/films}">
                <i class="fas fa-fw fa-video"></i>
                <span>Films</span>
            </a>
        </li>

        <li class="nav-item" th:classappend="${currentPage == 'genres'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin/genres}">
                <i class="fas fa-fw fa-tags"></i>
                <span>Genres</span>
            </a>
        </li>

        <li class="nav-item" th:classappend="${currentPage == 'salles'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin/salles}">
                <i class="fas fa-fw fa-building"></i>
                <span>Salles</span>
            </a>
        </li>

        <li class="nav-item" th:classappend="${currentPage == 'seances'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin/seances}">
                <i class="fas fa-fw fa-clock"></i>
                <span>Seances</span>
            </a>
        </li>

        <li class="nav-item" th:classappend="${currentPage == 'nationalites'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin/nationalites}">
                <i class="fas fa-fw fa-flag"></i>
                <span>Nationalites</span>
            </a>
        </li>

        <li class="nav-item" th:classappend="${currentPage == 'personnes'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin/personnes}">
                <i class="fas fa-fw fa-user"></i>
                <span>Personnes</span>
            </a>
        </li>

        <li class="nav-item" th:classappend="${currentPage == 'medias'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin/medias}">
                <i class="fas fa-fw fa-images"></i>
                <span>Medias</span>
            </a>
        </li>

        <li class="nav-item" th:classappend="${currentPage == 'customers'} ? 'active' : ''">
            <a class="nav-link" th:href="@{/admin/customers}">
                <i class="fas fa-fw fa-user-group"></i>
                <span>Customers</span>
            </a>
        </li>

        <hr class="sidebar-divider d-none d-md-block"/>
        <div class="text-center d-none d-md-inline">
            <button class="rounded-circle border-0" id="sidebarToggle"></button>
        </div>
    </ul>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle me-3">
                    <i class="fa fa-bars"></i>
                </button>
                <span class="navbar-text fw-bold text-gray-800">Administration CineGo</span>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-globe fa-fw"></i>
                            <span class="d-none d-lg-inline text-gray-600 small">Site Public</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link">
                                <i class="fas fa-sign-out-alt fa-fw"></i>
                                <span class="d-none d-lg-inline text-gray-600 small">Deconnexion</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </nav>

            <div class="container-fluid">
                <div layout:fragment="content"></div>
            </div>
        </div>

        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>CineGo Admin &copy; 2026</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
