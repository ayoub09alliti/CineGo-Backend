<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Mon Profil - CineGo Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div layout:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Mon Profil</h1>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${param.updated}" class="alert alert-success">Profil mis a jour avec succes.</div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <form th:action="@{/admin/profile}" th:object="${form}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" th:field="*{username}" class="form-control" required="required"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required="required"/>
                    </div>
                </div>

                <h6 class="text-primary fw-bold mt-4 mb-3"><i class="fas fa-key"></i> Changer le mot de passe</h6>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Mot de passe actuel</label>
                        <input type="password" th:field="*{currentPassword}" class="form-control" required="required"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Nouveau mot de passe</label>
                        <input type="password" th:field="*{newPassword}" class="form-control" placeholder="Laisser vide pour ne pas changer"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Confirmer le nouveau mot de passe</label>
                        <input type="password" th:field="*{confirmPassword}" class="form-control"/>
                    </div>
                </div>

                <hr/>
                <a th:href="@{/admin}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Annuler</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
